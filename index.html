<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Veri Terminali</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #030712;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --text: #ffffff;
      --text-muted: #64748b;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.15);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.15);
      --cyan: #38bdf8;
      --cyan-bg: rgba(56, 189, 248, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 110px;
      overflow-x: hidden;
    }

    /* ÜST AURORA */
    .top-aurora {
      background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #0c0a2a 45%, var(--bg) 85%);
      padding: 10px 14px 12px;
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .status-row {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }
    .status-chip {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.open { background: #22c55e; }

    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 8px 12px;
      gap: 8px;
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      width: 100%;
    }
    .search-box input::placeholder { color: #64748b; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    /* KESİNTİSİZ KAYAN VE TIKLANABİLİR ENDEKS ŞERİDİ */
    .tape-container {
      margin-top: 10px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      display: flex;
    }
    .tape-container::-webkit-scrollbar { display: none; }
    
    .tape-track {
      display: flex;
      gap: 8px;
    }

    .tape-item {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      gap: 6px;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .tape-title { color: #cbd5e1; }
    .tape-val.up { color: var(--green); }
    .tape-val.down { color: var(--red); }

    /* SAYFALAR */
    .page-section { display: none; padding: 14px 16px; }
    .page-section.active { display: block; }

    /* HİSSE LİSTESİ */
    .stock-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      cursor: pointer;
    }
    .stock-left { display: flex; align-items: center; gap: 12px; }
    .stock-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .stock-meta { display: flex; flex-direction: column; gap: 2px; }
    .stock-code { font-size: 15px; font-weight: 700; }
    .stock-title { font-size: 11px; color: var(--text-muted); max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .stock-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .stock-price { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stock-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }
    .stock-badge.up { background: var(--green-bg); color: var(--green); }
    .stock-badge.down { background: var(--red-bg); color: var(--red); }

    /* HABERLER */
    .news-card {
      background: #0d131f;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .news-tag {
      background: #92400e;
      color: #fef08a;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;
    }
    .news-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
    .news-snippet { font-size: 12px; color: #94a3b8; line-height: 1.4; }
    .news-date { font-size: 10px; color: #64748b; margin-top: 6px; }

    /* AUTOCOMPLETE POPUP */
    .autocomplete-list {
      position: absolute;
      top: 50px;
      left: 0;
      right: 0;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      display: none;
    }
    .autocomplete-item {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: flex-end;
    }
    .modal-sheet {
      background: #0b1120;
      border-top: 1px solid #1e293b;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-close {
      background: #1e293b;
      border: none;
      color: #94a3b8;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    /* FLOATING TABBAR */
    .tabbar-container {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
    }
    .tabbar {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      padding: 6px 14px;
      border-radius: 32px;
      display: flex;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 16px;
    }
    .tab-item svg { width: 20px; height: 20px; stroke: #64748b; fill: none; stroke-width: 2; }
    .tab-item.active { color: #ffffff; background: rgba(255, 255, 255, 0.08); }
    .tab-item.active svg { stroke: var(--cyan); }
  </style>
</head>
<body>

  <!-- AURORA HEADER -->
  <div class="top-aurora">
    <div class="status-row">
      <div class="status-chip">
        <span class="status-dot" id="statusDot"></span>
        <span id="marketStatusText">Piyasa Kontrol Ediliyor...</span>
      </div>
    </div>

    <div class="search-row">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Hisse ara..." oninput="handleGlobalSearch()">
      </div>
      <div class="icon-btn" onclick="triggerHaptic()">🔔</div>
      <div class="icon-btn" onclick="switchNav('diger')">⚙️</div>

      <div class="autocomplete-list" id="autocompleteBox"></div>
    </div>

    <!-- TIKLANABİLİR ENDEKS VE EMTİA ŞERİDİ -->
    <div class="tape-container">
      <div class="tape-track" id="tapeTrack"></div>
    </div>
  </div>

  <!-- 1. ANASAYFA -->
  <div id="view-anasayfa" class="page-section active">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <div style="font-size:18px; font-weight:700;">Hisseler & Favoriler (<span id="favCount">0</span>)</div>
      <button style="background:var(--cyan-bg); border:1px solid rgba(56,189,248,0.3); color:var(--cyan); font-size:12px; font-weight:600; padding:6px 12px; border-radius:16px;" onclick="triggerHaptic()">🔔 Alarmlarım</button>
    </div>
    <div class="stock-list" id="stockListContainer"></div>
  </div>

  <!-- 2. HABERLER -->
  <div id="view-haberler" class="page-section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <div style="font-size:18px; font-weight:700;">KAP & SPK Haberleri</div>
      <button style="background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1); color:#fff; font-size:12px; padding:6px 12px; border-radius:12px;" onclick="refreshAllData()">🔄 Yenile</button>
    </div>
    <div id="newsListContainer">
      <div style="text-align:center; padding:40px; color:#64748b;">Haberler yükleniyor...</div>
    </div>
  </div>

  <!-- 3. PORTFÖY -->
  <div id="view-portfoy" class="page-section">
    <div style="font-size:13px; color:#64748b;">Toplam Varlık</div>
    <div style="font-size:26px; font-weight:800; margin:4px 0 16px;" id="totalPortfolioValue">0,00 ₺</div>

    <div style="margin-bottom:14px; position:relative;">
      <input type="text" id="portfolioSearchInput" placeholder="Hisse ara ve portföye ekle (örn: tup, asels)..." 
             style="width:100%; background:#0f172a; border:1px solid #1e293b; padding:12px 14px; border-radius:12px; color:#fff; outline:none;"
             oninput="handlePortfolioSearch()">
      <div class="autocomplete-list" id="portfolioAutocompleteBox"></div>
    </div>

    <div id="portfolioListContainer"></div>
  </div>

  <!-- 4. DİĞER -->
  <div id="view-diger" class="page-section">
    <div style="font-size:18px; font-weight:700; margin-bottom:16px;">Ayarlar</div>
    <div style="background:#0f172a; border:1px solid #1e293b; border-radius:14px; padding:14px; display:flex; justify-content:space-between; margin-bottom:10px;">
      <span>Koyu Tema</span><span style="color:var(--cyan); font-weight:700;">AÇIK</span>
    </div>
  </div>

  <!-- DETAY MODALI (HİSSE VEYA ENDEKS İÇİN) -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div>
          <div style="font-size:20px; font-weight:800;" id="modalStockCode">THYAO</div>
          <div style="font-size:12px; color:#64748b;" id="modalStockName">Türk Hava Yolları</div>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
          <button id="modalFavBtn" style="background:transparent; border:none; font-size:20px; cursor:pointer;" onclick="toggleModalFav()">⭐</button>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
      </div>

      <div style="background:#0f172a; border:1px solid #1e293b; border-radius:14px; padding:14px; display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
        <div>
          <div style="font-size:11px; color:#64748b;">Son Değer</div>
          <div style="font-size:20px; font-weight:800;" id="modalStockPrice">0,00 ₺</div>
        </div>
        <div id="modalStockBadge" class="stock-badge up">%0,00</div>
      </div>

      <!-- Endeks Bileşenleri Alanı (Endekse tıklandığında açılır) -->
      <div id="modalIndexStocksContainer" style="display:none; margin-bottom:18px;">
        <div style="font-size:14px; font-weight:700; margin-bottom:8px; color:var(--cyan);">Endekse Dahil Hisseler</div>
        <div class="stock-list" id="modalIndexList"></div>
      </div>

      <div style="font-size:15px; font-weight:700; margin-bottom:10px;">İlgili Haberler</div>
      <div id="modalNewsContainer"></div>
    </div>
  </div>

  <!-- PORTFÖYE EKLEME MODAL -->
  <div class="modal-overlay" id="addPortfolioModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div style="font-size:18px; font-weight:800;" id="addStockTitle">Hisse Ekle</div>
        <button class="modal-close" onclick="closeAddModal()">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <div>
          <label style="font-size:12px; color:#64748b;">Lot Miktarı</label>
          <input type="number" id="addLotInput" placeholder="Örn: 100" style="width:100%; background:#0f172a; border:1px solid #1e293b; padding:12px; border-radius:10px; color:#fff; outline:none; margin-top:4px;">
        </div>
        <div>
          <label style="font-size:12px; color:#64748b;">Maliyet (Alış Fiyatı ₺)</label>
          <input type="number" step="0.01" id="addPriceInput" placeholder="Örn: 24.50" style="width:100%; background:#0f172a; border:1px solid #1e293b; padding:12px; border-radius:10px; color:#fff; outline:none; margin-top:4px;">
        </div>
        <button onclick="saveStockToPortfolio()" style="background:var(--cyan); border:none; color:#030712; font-weight:700; padding:14px; border-radius:12px; margin-top:8px; cursor:pointer;">Portföye Kaydet</button>
      </div>
    </div>
  </div>

  <!-- FLOATING TABBAR -->
  <div class="tabbar-container">
    <div class="tabbar">
      <button class="tab-item active" onclick="switchNav('anasayfa', this)">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Anasayfa</span>
      </button>
      <button class="tab-item" onclick="switchNav('haberler', this)">
        <svg viewBox="0 0 24 24"><path d="M19 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10l5 5v11a2 2 0 0 1-2 2z"></path><line x1="9" y1="9" x2="13" y2="9"></line><line x1="9" y1="13" x2="15" y2="13"></line><line x1="9" y1="17" x2="15" y2="17"></line></svg>
        <span>Haberler</span>
      </button>
      <button class="tab-item" onclick="switchNav('portfoy', this)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>Portföy</span>
      </button>
      <button class="tab-item" onclick="switchNav('diger', this)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
        <span>Diğer</span>
      </button>
    </div>
  </div>

  <script>
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbycfagN7VhPdUfJGeHyvb_LX1brdSDUTJZpRGFamJ48pQb1laidkwHypcQ3tu6Eg9Vy/exec";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
    }

    let globalData = [];
    let globalNews = [];
    let favorites = JSON.parse(localStorage.getItem('bist_favs')) || ['TUPRS', 'ALTIN.S1', 'THYAO', 'ASELS', 'AKSA', 'KCHOL'];
    let myPortfolio = JSON.parse(localStorage.getItem('bist_portfolio')) || [];
    let isMarketOpenGlobal = false;
    let selectedStockForModal = null;
    let selectedStockForAdd = null;

    function triggerHaptic() {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    // GÜVENLİ LİNK AÇMA (Engellenen Google News linklerini Telegram dışı tarayıcıda açar)
    function safeOpenLink(url) {
      if (!url || url === '#' || url === 'undefined') return;
      if (tg && typeof tg.openLink === 'function') {
        tg.openLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    // HER SANİYE AKAN CANLI SAAT MOTORU
    function startLiveClock() {
      setInterval(() => {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const txt = document.getElementById('marketStatusText');
        const dot = document.getElementById('statusDot');
        
        dot.className = isMarketOpenGlobal ? 'status-dot open' : 'status-dot';
        txt.innerText = (isMarketOpenGlobal ? 'Piyasa Açık' : 'Piyasa Kapalı') + ' • ' + timeStr;
      }, 1000);
    }

    function switchNav(viewId, btn) {
      triggerHaptic();
      document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
      
      const target = document.getElementById('view-' + viewId);
      if (target) target.classList.add('active');
      if (btn) btn.classList.add('active');

      if (viewId === 'haberler') refreshAllData();
      if (viewId === 'portfoy') renderPortfolio();
    }

    async function refreshAllData() {
      try {
        const res = await fetch(API_ENDPOINT);
        const data = await res.json();
        
        if (data.marketData) {
          globalData = data.marketData;
          globalNews = data.news || [];
          isMarketOpenGlobal = data.status;
          renderTapeSlider();
          renderMainList();
          renderNewsList();
          renderPortfolio();
        }
      } catch (err) {}
    }

    // KAYAN VE TIKLANABİLİR ŞERİT
    function renderTapeSlider() {
      const track = document.getElementById('tapeTrack');
      const wanted = ['XU100', 'XU050', 'XU030', 'USD', 'EUR', 'GRAM', 'ALTIN.S1'];
      track.innerHTML = '';

      wanted.forEach(code => {
        const item = globalData.find(d => d.code.toUpperCase().includes(code)) || { code: code, price: '0,00', change: '%0,00', name: code };
        const isUp = item.change.includes('+') || (!item.change.includes('-') && item.change !== '0' && item.change !== '%0,00');
        const badgeClass = isUp ? 'up' : 'down';
        
        const el = document.createElement('div');
        el.className = 'tape-item';
        el.onclick = () => openStockDetail(item.code);
        el.innerHTML = `
          <span class="tape-title">${item.code}</span>
          <span class="tape-val ${badgeClass}">${item.price} ${item.change}</span>
        `;
        track.appendChild(el);
      });
    }

    // ANA SAYFA LİSTESİ
    function renderMainList() {
      const container = document.getElementById('stockListContainer');
      container.innerHTML = '';

      // Favoriler en üstte, sonra diğer hisseler
      let displayList = [...globalData].sort((a, b) => {
        const aFav = favorites.includes(a.code) ? 1 : 0;
        const bFav = favorites.includes(b.code) ? 1 : 0;
        return bFav - aFav;
      });

      document.getElementById('favCount').innerText = favorites.length;

      displayList.forEach(item => {
        if (item.type !== 'endeks') {
          container.appendChild(createStockRow(item));
        }
      });
    }

    function createStockRow(item) {
      const isUp = item.change.includes('+') || (!item.change.includes('-') && item.change !== '0' && item.change !== '%0,00');
      const badgeClass = isUp ? 'up' : 'down';
      const isFav = favorites.includes(item.code);

      const div = document.createElement('div');
      div.className = 'stock-row';
      div.onclick = () => openStockDetail(item.code);
      div.innerHTML = `
        <div class="stock-left">
          <div class="stock-avatar">${item.code.substring(0,2)}</div>
          <div class="stock-meta">
            <div class="stock-code">${item.code} ${isFav ? '⭐' : ''}</div>
            <div class="stock-title">${item.name}</div>
          </div>
        </div>
        <div class="stock-right">
          <div class="stock-price">${item.price} ₺</div>
          <div class="stock-badge ${badgeClass}">${item.change}</div>
        </div>
      `;
      return div;
    }

    // HABERLER LİSTESİ (Sütun kayması düzeltildi)
    function renderNewsList() {
      const container = document.getElementById('newsListContainer');
      if (globalNews.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b;">Kayıtlı haber bulunamadı.</div>';
        return;
      }

      container.innerHTML = '';
      globalNews.forEach(n => {
        const div = document.createElement('div');
        div.className = 'news-card';
        div.onclick = () => safeOpenLink(n.link);
        div.innerHTML = `
          <span class="news-tag">${n.source}</span>
          <div class="news-title">${n.title}</div>
          <div class="news-date">${n.date} • Habere Git ↗</div>
        `;
        container.appendChild(div);
      });
    }

    // HİSSE & ENDEKS DETAY MODAL
    async function openStockDetail(code) {
      triggerHaptic();
      const item = globalData.find(d => d.code === code) || { code: code, name: code, price: '0,00', change: '%0,00', type: 'bist' };
      selectedStockForModal = item;

      document.getElementById('modalStockCode').innerText = item.code;
      document.getElementById('modalStockName').innerText = item.name;
      document.getElementById('modalStockPrice').innerText = item.price + ' ₺';
      
      const isUp = item.change.includes('+') || (!item.change.includes('-') && item.change !== '0' && item.change !== '%0,00');
      const badge = document.getElementById('modalStockBadge');
      badge.className = 'stock-badge ' + (isUp ? 'up' : 'down');
      badge.innerText = item.change;

      updateModalFavIcon();

      // Endeks tıklandıysa (XU100, XU030 vb.) hisse bileşenlerini listele
      const indexContainer = document.getElementById('modalIndexStocksContainer');
      const indexList = document.getElementById('modalIndexList');
      if (item.type === 'endeks' || item.code.startsWith('XU')) {
        indexContainer.style.display = 'block';
        indexList.innerHTML = '';
        globalData.filter(d => d.type === 'bist' || (!d.type && !d.code.startsWith('XU'))).forEach(st => {
          indexList.appendChild(createStockRow(st));
        });
      } else {
        indexContainer.style.display = 'none';
      }

      document.getElementById('detailModal').style.display = 'flex';

      // İlgili Haberler
      const modalNews = document.getElementById('modalNewsContainer');
      modalNews.innerHTML = '<div style="text-align:center; padding:20px; color:#64748b;">Haberler yükleniyor...</div>';

      const localMatches = globalNews.filter(n => n.title.toUpperCase().includes(code));
      if (localMatches.length > 0) {
        renderModalNewsCards(localMatches, modalNews);
      } else {
        try {
          const res = await fetch(`${API_ENDPOINT}?action=stock_news&symbol=${code}`);
          const json = await res.json();
          if (json.news && json.news.length > 0) {
            renderModalNewsCards(json.news, modalNews);
          } else {
            modalNews.innerHTML = '<div style="text-align:center; padding:20px; color:#64748b;">İlgili haber bulunamadı.</div>';
          }
        } catch (e) {
          modalNews.innerHTML = '<div style="text-align:center; padding:20px; color:#64748b;">Haber servisine bağlanılamadı.</div>';
        }
      }
    }

    function renderModalNewsCards(newsArray, container) {
      container.innerHTML = '';
      newsArray.forEach(n => {
        const div = document.createElement('div');
        div.className = 'news-card';
        div.onclick = () => safeOpenLink(n.link);
        div.innerHTML = `
          <div class="news-title">${n.title}</div>
          <div class="news-snippet">${n.snippet || ''}</div>
          <div class="news-date">Haberi Aç ↗</div>
        `;
        container.appendChild(div);
      });
    }

    function updateModalFavIcon() {
      const isFav = favorites.includes(selectedStockForModal.code);
      document.getElementById('modalFavBtn').innerText = isFav ? '⭐' : '☆';
    }

    function toggleModalFav() {
      triggerHaptic();
      const code = selectedStockForModal.code;
      const idx = favorites.indexOf(code);
      if (idx > -1) favorites.splice(idx, 1);
      else favorites.push(code);
      localStorage.setItem('bist_favs', JSON.stringify(favorites));
      updateModalFavIcon();
      renderMainList();
    }

    function closeModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    // ARAMA VE AUTOCOMPLETE
    function handlePortfolioSearch() {
      const q = document.getElementById('portfolioSearchInput').value.trim().toUpperCase();
      const box = document.getElementById('portfolioAutocompleteBox');
      if (!q) { box.style.display = 'none'; return; }

      const matches = globalData.filter(d => d.code.includes(q) || d.name.toUpperCase().includes(q)).slice(0, 6);
      if (matches.length === 0) { box.style.display = 'none'; return; }

      box.innerHTML = '';
      matches.forEach(m => {
        const item = document.createElement('div');
        item.className = 'autocomplete-item';
        item.onclick = () => openAddPortfolioModal(m);
        item.innerHTML = `
          <div><strong>${m.code}</strong> - <span style="font-size:12px; color:#94a3b8;">${m.name}</span></div>
          <div style="font-weight:700;">${m.price} ₺</div>
        `;
        box.appendChild(item);
      });
      box.style.display = 'block';
    }

    function handleGlobalSearch() {
      const q = document.getElementById('searchInput').value.trim().toUpperCase();
      const box = document.getElementById('autocompleteBox');
      if (!q) { box.style.display = 'none'; return; }

      const matches = globalData.filter(d => d.code.includes(q) || d.name.toUpperCase().includes(q)).slice(0, 6);
      if (matches.length === 0) { box.style.display = 'none'; return; }

      box.innerHTML = '';
      matches.forEach(m => {
        const item = document.createElement('div');
        item.className = 'autocomplete-item';
        item.onclick = () => {
          box.style.display = 'none';
          openStockDetail(m.code);
        };
        item.innerHTML = `
          <div><strong>${m.code}</strong> - <span style="font-size:12px; color:#94a3b8;">${m.name}</span></div>
          <div style="font-weight:700;">${m.price} ₺</div>
        `;
        box.appendChild(item);
      });
      box.style.display = 'block';
    }

    // PORTFÖY MODALI
    function openAddPortfolioModal(stock) {
      triggerHaptic();
      selectedStockForAdd = stock;
      document.getElementById('portfolioAutocompleteBox').style.display = 'none';
      document.getElementById('addStockTitle').innerText = `${stock.code} Portföye Ekle`;
      document.getElementById('addPriceInput').value = parseFloat(stock.price.replace('.','').replace(',','.'));
      document.getElementById('addLotInput').value = '';
      document.getElementById('addPortfolioModal').style.display = 'flex';
    }

    function closeAddModal() {
      document.getElementById('addPortfolioModal').style.display = 'none';
    }

    function saveStockToPortfolio() {
      triggerHaptic();
      const lot = parseFloat(document.getElementById('addLotInput').value);
      const cost = parseFloat(document.getElementById('addPriceInput').value);
      if (!lot || !cost) return;

      myPortfolio.push({ code: selectedStockForAdd.code, lot: lot, cost: cost });
      localStorage.setItem('bist_portfolio', JSON.stringify(myPortfolio));
      closeAddModal();
      document.getElementById('portfolioSearchInput').value = '';
      renderPortfolio();
    }

    function renderPortfolio() {
      const container = document.getElementById('portfolioListContainer');
      if (myPortfolio.length === 0) {
        container.innerHTML = `
          <div style="background:#0f172a; border:1px solid #1e293b; border-radius:14px; padding:30px; text-align:center; color:#64748b; font-size:13px;">
            Portföyünüz boş. Arama çubuğundan hisse ekleyebilirsiniz.
          </div>`;
        document.getElementById('totalPortfolioValue').innerText = '0,00 ₺';
        return;
      }

      let totalVal = 0;
      container.innerHTML = '';

      myPortfolio.forEach(pos => {
        const cur = globalData.find(d => d.code === pos.code) || { price: pos.cost.toString(), change: '%0' };
        const priceNum = parseFloat(cur.price.replace('.','').replace(',','.')) || pos.cost;
        const val = priceNum * pos.lot;
        const profitPct = ((priceNum - pos.cost) / pos.cost) * 100;
        totalVal += val;

        const isUp = profitPct >= 0;
        const row = document.createElement('div');
        row.className = 'stock-row';
        row.innerHTML = `
          <div class="stock-left">
            <div class="stock-avatar">${pos.code.substring(0,2)}</div>
            <div class="stock-meta">
              <div class="stock-code">${pos.code}</div>
              <div class="stock-title">${pos.lot} Lot • Maliyet: ${pos.cost.toFixed(2)} ₺</div>
            </div>
          </div>
          <div class="stock-right">
            <div class="stock-price">${val.toLocaleString('tr-TR', {minimumFractionDigits: 2})} ₺</div>
            <div class="stock-badge ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${profitPct.toFixed(2)}%</div>
          </div>
        `;
        container.appendChild(row);
      });

      document.getElementById('totalPortfolioValue').innerText = totalVal.toLocaleString('tr-TR', {minimumFractionDigits: 2}) + ' ₺';
    }

    window.onload = () => {
      startLiveClock();
      refreshAllData();
    };
  </script>
</body>
</html>
